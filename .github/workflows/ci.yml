name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 全部验证闸门
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 全部 Node 验证闸门
        run: npm run verify

  desktop:
    name: 桌面端编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet build
        run: dotnet build panel/app/CodexQuota.csproj -c Release --nologo
      - name: Desktop API response checks
        run: dotnet run --project panel/test/desktop-api/DesktopApiTests.csproj -c Release
      - name: Desktop account rule editor checks
        run: dotnet run --project panel/test/desktop-rules/DesktopRuleTests.csproj -c Release
